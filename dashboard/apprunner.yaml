version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "No build commands needed"
run:
  runtime-version: 3.11
  command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
  network:
    port: 8501
  env:
    - name: DYNAMODB_TABLE_NAME
      value: fraudguard-events-dev
    - name: S3_BUCKET_NAME
      value: ""
    - name: AWS_REGION
      value: us-east-1

