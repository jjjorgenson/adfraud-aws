name: Deploy Dashboard

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fraudguard-dashboard
  APP_RUNNER_SERVICE: fraudguard-dashboard

jobs:
  build-and-deploy:
    name: Build and Deploy Dashboard
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Set environment variables
        id: env
        run: |
          # Determine environment: use input if manual dispatch, otherwise default to 'dev'
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="dev"
          fi
          
          echo "Setting environment to: ${ENV}"
          
          case $ENV in
            dev)
              echo "table_name=fraudguard-events-dev" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "table_name=fraudguard-events-staging" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "table_name=fraudguard-events-prod" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "table_name=fraudguard-events-dev" >> $GITHUB_OUTPUT
              ENV="dev"
              ;;
          esac
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "✅ Environment set to: ${ENV}"
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image
        id: build-image
        working-directory: ./dashboard
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ENV="${{ steps.env.outputs.environment }}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-${IMAGE_TAG}"
          
          echo "Building Docker image for ${ENV} environment..."
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "ENV=${ENV}"
          echo "IMAGE_URI=${IMAGE_URI}"
          
          docker build -t "${IMAGE_URI}" .
          docker tag "${IMAGE_URI}" "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-latest"
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          ENV="${{ steps.env.outputs.environment }}"
          echo "Pushing image to ECR..."
          echo "IMAGE_URI=${IMAGE_URI}"
          docker push "${IMAGE_URI}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-latest"
          echo "✅ Image pushed successfully"
      
      - name: Get App Runner service ARN
        id: get-service
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          SERVICE_ARN=$(aws apprunner list-services \
            --region "${{ env.AWS_REGION }}" \
            --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}-${ENV}'].ServiceArn" \
            --output text)
          
          if [ -z "$SERVICE_ARN" ]; then
            echo "Service not found. Creating new App Runner service..."
            echo "create_new=true" >> $GITHUB_OUTPUT
          else
            echo "service_arn=${SERVICE_ARN}" >> $GITHUB_OUTPUT
            echo "create_new=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Create App Runner service (if needed)
        if: steps.get-service.outputs.create_new == 'true'
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          TABLE_NAME="${{ steps.env.outputs.table_name }}"
          
          echo "Creating new App Runner service: ${{ env.APP_RUNNER_SERVICE }}-${ENV}"
          echo "IMAGE_URI=${IMAGE_URI}"
          
          aws apprunner create-service \
            --service-name "${{ env.APP_RUNNER_SERVICE }}-${ENV}" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${IMAGE_URI}\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"8501\",
                  \"RuntimeEnvironmentVariables\": {
                    \"DYNAMODB_TABLE_NAME\": \"${TABLE_NAME}\",
                    \"AWS_REGION\": \"${{ env.AWS_REGION }}\"
                  }
                }
              }
            }" \
            --instance-configuration "{
              \"Cpu\": \"1 vCPU\",
              \"Memory\": \"2 GB\"
            }" \
            --region "${{ env.AWS_REGION }}" \
            --output json || echo "Service creation may have failed or service already exists"
        continue-on-error: true
      
      - name: Update App Runner service
        if: steps.get-service.outputs.create_new == 'false'
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          TABLE_NAME="${{ steps.env.outputs.table_name }}"
          SERVICE_ARN="${{ steps.get-service.outputs.service_arn }}"
          
          echo "Updating App Runner service: ${SERVICE_ARN}"
          echo "IMAGE_URI=${IMAGE_URI}"
          
          aws apprunner start-deployment \
            --service-arn "${SERVICE_ARN}" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${IMAGE_URI}\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"8501\",
                  \"RuntimeEnvironmentVariables\": {
                    \"DYNAMODB_TABLE_NAME\": \"${TABLE_NAME}\",
                    \"AWS_REGION\": \"${{ env.AWS_REGION }}\"
                  }
                }
              }
            }" \
            --region "${{ env.AWS_REGION }}" \
            --output json
          echo "✅ Deployment started"
        continue-on-error: true
      
      - name: Wait for deployment
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          SERVICE_ARN="${{ steps.get-service.outputs.service_arn }}"
          
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            SERVICE_ARN=$(aws apprunner list-services \
              --region "${{ env.AWS_REGION }}" \
              --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}-${ENV}'].ServiceArn" \
              --output text)
          fi
          
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "Waiting for deployment to complete for service: ${SERVICE_ARN}"
            aws apprunner wait service-in-service \
              --service-arn "${SERVICE_ARN}" \
              --region "${{ env.AWS_REGION }}" \
              --max-attempts 30 \
              --delay 10 || echo "⚠️  Deployment may still be in progress (this is normal)"
          else
            echo "⚠️  Could not find service ARN, skipping wait"
          fi
        continue-on-error: true
      
      - name: Get service URL
        id: get-url
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          SERVICE_ARN="${{ steps.get-service.outputs.service_arn }}"
          
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            SERVICE_ARN=$(aws apprunner list-services \
              --region "${{ env.AWS_REGION }}" \
              --query "ServiceSummaryList[?ServiceName=='${{ env.APP_RUNNER_SERVICE }}-${ENV}'].ServiceArn" \
              --output text)
          fi
          
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            SERVICE_URL=$(aws apprunner describe-service \
              --service-arn "${SERVICE_ARN}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Service.ServiceUrl' \
              --output text)
            
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Dashboard deployed to: ${SERVICE_URL}"
          else
            echo "⚠️  Could not retrieve service URL"
            echo "service_url=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Deployment summary
        run: |
          echo "## 🛡️ Dashboard Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.build-image.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.get-url.outputs.service_url }}" ]; then
            echo "**Service URL:** ${{ steps.get-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Status:** ✅ Deployment completed" >> $GITHUB_STEP_SUMMARY

