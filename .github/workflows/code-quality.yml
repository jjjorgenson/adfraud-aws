name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 pylint mypy
      
      - name: Format code with black
        run: |
          black --check --diff src/ || true
      
      - name: Sort imports with isort
        run: |
          isort --check-only --diff src/ || true
      
      - name: Lint with flake8
        run: |
          flake8 src/ --max-line-length=127 --extend-ignore=E203,W503 || true
      
      - name: Lint with pylint
        run: |
          pylint src/ --disable=all --enable=E,F || true
      
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional || true
      
      - name: Check for security issues
        run: |
          pip install bandit safety
          bandit -r src/ -f json -o bandit-report.json || true
          find src -name "requirements.txt" -exec safety check --file {} \; || true

